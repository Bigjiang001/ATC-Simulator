<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATC2.0 在线版｜空中交通管制模拟游戏 (Harbor / Haneda / Pudong / Heathrow)</title>
  <style>
:root {
  --bg-deep: #04080d;
  --bg-panel: #08111a;
  --bg-card: #0c1824;
  --bg-card-hover: #112233;
  --border-dim: rgba(0, 229, 163, 0.2);
  --border-bright: rgba(0, 229, 163, 0.55);
  --radar-green: #00e5a3;
  --radar-cyan: #38bdf8;
  --radar-amber: #fbbf24;
  --radar-red: #ef4444;
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body,
#root {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: var(--font-mono);
}

.accent-green {
  color: var(--radar-green) !important;
}

.accent-cyan {
  color: var(--radar-cyan) !important;
}

.accent-amber {
  color: var(--radar-amber) !important;
}

.accent-red {
  color: var(--radar-red) !important;
}

/* 整体五区管制工作站布局 */
.atc-workstation {
  display: grid;
  grid-template-rows: 52px 1fr 136px;
  width: 100vw;
  height: 100vh;
  background: var(--bg-deep);
}

/* 顶部状态栏 (区域 4) */
.atc-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: linear-gradient(180deg, #0b1724 0%, #071019 100%);
  border-bottom: 1px solid var(--border-dim);
  gap: 8px;
  overflow: hidden;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  white-space: nowrap;
}

.radar-pulse-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--radar-green);
  box-shadow: 0 0 10px var(--radar-green);
  flex-shrink: 0;
}

.brand-title {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.6px;
  color: var(--radar-green);
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-muted);
}

.topbar-metrics {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  flex-shrink: 0;
}

.metric-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2px 7px;
  background: rgba(12, 24, 36, 0.85);
  border: 1px solid rgba(56, 189, 248, 0.18);
  border-radius: 4px;
  white-space: nowrap;
}

.metric-alert-active {
  background: rgba(127, 29, 29, 0.45);
  border-color: var(--radar-red);
}

.metric-label {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.metric-val {
  font-size: 12px;
  font-weight: 700;
  color: #f8fafc;
  white-space: nowrap;
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.control-group {
  display: flex;
  align-items: center;
  background: #060d14;
  padding: 2px;
  border-radius: 4px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  gap: 2px;
  flex-shrink: 0;
}

.btn-chip {
  background: transparent;
  color: var(--text-muted);
  border: none;
  padding: 4px 7px;
  font-size: 11px;
  font-family: var(--font-mono);
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s ease;
}

.btn-chip:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

.btn-chip.active {
  background: rgba(0, 229, 163, 0.2);
  color: var(--radar-green);
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0, 229, 163, 0.45);
}

.btn-chip.active-warn {
  background: rgba(245, 158, 11, 0.25);
  color: var(--radar-amber);
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.5);
}

/* 中央主区域 */
.atc-main-body {
  display: grid;
  grid-template-columns: 1fr 440px;
  min-height: 0;
  overflow: hidden;
}

/* 区域 1：中央雷达区 */
.radar-Workspace {
  position: relative;
  width: 100%;
  height: 100%;
  background: #050b10;
  overflow: hidden;
  border-right: 1px solid var(--border-dim);
}

.radar-canvas {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

.radar-overlay-Controls {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  z-index: 5;
}

.overlay-btn {
  background: rgba(8, 17, 26, 0.85);
  color: var(--text-muted);
  border: 1px solid rgba(0, 229, 163, 0.28);
  padding: 4px 9px;
  font-size: 11px;
  font-family: var(--font-mono);
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}

.overlay-btn:hover {
  color: #fff;
  border-color: var(--radar-green);
}

.overlay-btn.active {
  background: rgba(0, 229, 163, 0.16);
  color: var(--radar-green);
  border-color: var(--radar-green);
}

/* AMAN 进港排序时间轴浮窗 */
.aman-timeline-card {
  position: absolute;
  top: 46px;
  left: 12px;
  width: 228px;
  background: rgba(7, 16, 25, 0.9);
  border: 1px solid rgba(0, 229, 163, 0.32);
  border-radius: 4px;
  padding: 6px 8px;
  z-index: 5;
}

.aman-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--radar-green);
  border-bottom: 1px solid rgba(0, 229, 163, 0.18);
  padding-bottom: 4px;
  margin-bottom: 4px;
}

.aman-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.aman-item {
  padding: 4px 6px;
  background: rgba(12, 24, 36, 0.85);
  border-left: 3px solid var(--radar-cyan);
  border-radius: 3px;
  cursor: pointer;
  font-size: 10px;
}

.aman-item.aman-selected {
  background: rgba(20, 40, 60, 0.95);
  border-left-color: #ffffff;
}

.aman-item.aman-emergency {
  border-left-color: var(--radar-red);
  background: rgba(85, 16, 22, 0.75);
}

.aman-row-top {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 1px;
}

.aman-rank {
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.aman-rwy {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 0 4px;
  background: rgba(56, 189, 248, 0.2);
  color: var(--radar-cyan);
  border-radius: 2px;
}

.aman-eta {
  margin-left: auto;
  color: var(--radar-green);
  font-weight: 700;
}

.aman-row-sub {
  font-size: 9.5px;
  color: var(--text-muted);
}

.radar-overlay-right {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 295px;
  z-index: 5;
  pointer-events: none;
}

.stca-banner {
  background: rgba(127, 29, 29, 0.92);
  border: 1px solid #ef4444;
  border-radius: 4px;
  padding: 8px 10px;
  color: #fecaca;
  font-family: var(--font-mono);
  box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
}

.stca-title {
  font-size: 11px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 4px;
}

.stca-item {
  font-size: 10.5px;
  padding: 2px 0;
}

.selected-hud-card {
  background: rgba(8, 17, 26, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.45);
  border-radius: 4px;
  padding: 8px 10px;
  font-family: var(--font-mono);
}

.hud-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.hud-callsign {
  font-size: 14px;
  font-weight: 800;
  color: #ffffff;
}

.hud-badge {
  font-size: 9.5px;
  padding: 1px 5px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  color: var(--text-main);
}

.hud-cat {
  margin-left: auto;
  font-size: 9.5px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 700;
}

.cat-arr {
  background: rgba(0, 229, 163, 0.18);
  color: var(--radar-green);
}

.cat-dep {
  background: rgba(251, 191, 36, 0.18);
  color: var(--radar-amber);
}

.hud-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  font-size: 11px;
}

.hud-grid small {
  display: block;
  font-size: 9px;
  color: var(--text-muted);
}

/* 右侧边栏：进程单 + 指令面板 */
.atc-right-sidebar {
  display: grid;
  grid-template-rows: 34% 66%;
  min-height: 0;
  background: var(--bg-panel);
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  background: #0b1723;
  border-bottom: 1px solid var(--border-dim);
  gap: 6px;
  flex-shrink: 0;
  overflow: hidden;
}

.panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--radar-cyan);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 区域 2：电子进程单 (Flight Strips) */
.flight-strip-bay {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 1px solid var(--border-dim);
}

.strip-tabs {
  display: flex;
  gap: 3px;
}

.tab-btn {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  border: 1px solid rgba(148, 163, 184, 0.2);
  padding: 2px 6px;
  font-size: 9.5px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}

.tab-btn.active {
  background: rgba(56, 189, 248, 0.2);
  color: var(--radar-cyan);
  border-color: var(--radar-cyan);
  font-weight: 700;
}

.strip-list {
  flex: 1;
  overflow-y: auto;
  padding: 5px 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.strip-empty {
  text-align: center;
  padding: 20px 10px;
  color: var(--text-muted);
  font-size: 12px;
}

.flight-strip {
  padding: 5px 8px;
  background: var(--bg-card);
  border-left: 4px solid var(--radar-green);
  border-top: 1px solid rgba(148, 163, 184, 0.14);
  border-right: 1px solid rgba(148, 163, 184, 0.14);
  border-bottom: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s ease;
}

.flight-strip:hover {
  background: var(--bg-card-hover);
}

.flight-strip.strip-dep {
  border-left-color: var(--radar-amber);
}

.flight-strip.strip-selected {
  background: #14283c;
  border-top-color: #ffffff;
  border-right-color: #ffffff;
  border-bottom-color: #ffffff;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
}

.flight-strip.strip-conflict {
  background: rgba(95, 18, 18, 0.65);
  border-color: var(--radar-red);
}

.strip-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.strip-id-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.strip-callsign {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  color: #ffffff;
}

.strip-model {
  font-family: var(--font-mono);
  font-size: 9.5px;
  padding: 0 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  color: var(--radar-cyan);
}

.strip-airline {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: var(--text-muted);
}

.strip-airline-name {
  color: #e2e8f0;
  font-weight: 600;
}

.strip-airline-logo {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  object-fit: contain;
  vertical-align: middle;
  flex-shrink: 0;
  box-shadow: 0 0 4px rgba(56, 189, 248, 0.35);
}

.strip-squawk {
  color: var(--text-muted);
}

.strip-phase-badge {
  font-family: var(--font-mono);
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
}

.phase-arr {
  background: rgba(0, 229, 163, 0.16);
  color: var(--radar-green);
}

.phase-dep,
.phase-tkof {
  background: rgba(251, 191, 36, 0.2);
  color: var(--radar-amber);
}

.phase-gnd {
  background: rgba(148, 163, 184, 0.2);
  color: #cbd5e1;
}

.phase-ils,
.phase-ils-lock {
  background: rgba(56, 189, 248, 0.24);
  color: var(--radar-cyan);
}

.phase-hold {
  background: rgba(168, 85, 247, 0.25);
  color: #d8b4fe;
}

.phase-warn {
  background: rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}

.phase-done,
.phase-land {
  background: rgba(34, 197, 94, 0.25);
  color: #86efac;
}

.strip-row-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  font-size: 11px;
  color: #cbd5e1;
  margin-bottom: 2px;
}

.m-lbl {
  color: var(--text-muted);
  font-size: 9.5px;
}

.m-arrow {
  color: var(--text-muted);
  margin: 0 2px;
}

.strip-row-bottom {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-muted);
}

.strip-cmd-tag {
  color: var(--radar-green);
}

/* 区域 3：管制指令台 (Command Panel) */
.command-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #071018;
}

.cmd-target-status {
  font-size: 10.5px;
  color: var(--radar-green);
  white-space: nowrap;
  flex-shrink: 0;
}

.cmd-empty {
  padding: 28px 14px;
  text-align: center;
  color: var(--text-muted);
}

.cmd-sections {
  flex: 1;
  overflow-y: auto;
  padding: 5px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cmd-block {
  background: rgba(12, 24, 36, 0.75);
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 4px;
  padding: 5px 7px;
}

.highlight-block {
  border-color: rgba(56, 189, 248, 0.35);
  background: rgba(12, 28, 44, 0.85);
}

.cmd-block-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.clearance-actions {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 5px;
  margin-top: 3px;
}

.btn-action {
  padding: 5px 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  border-radius: 4px;
  border: 1px solid rgba(148, 163, 184, 0.3);
  background: #102030;
  color: #e2e8f0;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.btn-action:hover:not(:disabled) {
  filter: brightness(1.15);
}

.btn-action:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-ils-ready {
  background: rgba(0, 229, 163, 0.22);
  border-color: var(--radar-green);
  color: var(--radar-green);
}

.btn-ils-active {
  background: rgba(56, 189, 248, 0.28);
  border-color: var(--radar-cyan);
  color: #ffffff;
}

.btn-takeoff-ready {
  background: rgba(251, 191, 36, 0.25);
  border-color: var(--radar-amber);
  color: var(--radar-amber);
}

.btn-handoff-ready {
  background: rgba(56, 189, 248, 0.3);
  border-color: var(--radar-cyan);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
}

.btn-warn {
  background: rgba(239, 68, 68, 0.18);
  border-color: rgba(239, 68, 68, 0.5);
  color: #fca5a5;
}

.ils-status-hint {
  margin-top: 4px;
  font-size: 10.5px;
  line-height: 1.35;
}

.hint-ok {
  color: var(--radar-green);
}

.hint-warn {
  color: var(--radar-amber);
}

.btn-grid-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 3px;
}

.btn-cmd {
  flex: 1 1 auto;
  min-width: 48px;
  max-width: 100%;
  padding: 4px 6px;
  background: #0e1c2a;
  color: #cbd5e1;
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}

.btn-cmd:hover {
  background: #172e44;
  color: #ffffff;
  border-color: var(--radar-cyan);
}

.btn-cmd.active {
  background: rgba(0, 229, 163, 0.22);
  color: var(--radar-green);
  border-color: var(--radar-green);
  font-weight: 700;
}

.btn-cmd.active-warn {
  background: rgba(251, 191, 36, 0.22);
  color: var(--radar-amber);
  border-color: var(--radar-amber);
  font-weight: 700;
}

.custom-input-row {
  display: flex;
  gap: 4px;
  align-items: center;
}

.cmd-num-input {
  width: 72px;
  padding: 3px 6px;
  background: #050b11;
  color: var(--radar-green);
  border: 1px solid rgba(0, 229, 163, 0.35);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

.cmd-cli-bar {
  display: flex;
  gap: 5px;
  margin-top: 1px;
}

.cli-input {
  flex: 1;
  padding: 4px 8px;
  background: #04090e;
  color: var(--radar-green);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

.btn-cli-send {
  padding: 4px 10px;
  background: rgba(56, 189, 248, 0.22);
  color: var(--radar-cyan);
  border: 1px solid var(--radar-cyan);
  border-radius: 3px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.cli-feedback {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--radar-cyan);
}

/* 区域 5：底部可拖拽缩放的无线电通信日志 */
.radio-comm-panel {
  display: flex;
  flex-direction: column;
  background: #050b11;
  border-top: 1px solid var(--border-dim);
  min-height: 0;
}

.comm-resize-handle {
  height: 15px;
  background: linear-gradient(180deg, #0d1d2c 0%, #08121c 100%);
  border-bottom: 1px solid rgba(0, 229, 163, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: ns-resize;
  flex-shrink: 0;
}

.comm-resize-handle:hover {
  background: rgba(0, 229, 163, 0.18);
}

.resize-grip-dots {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--radar-cyan);
  letter-spacing: 0.5px;
}

.comm-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 12px;
  background: #09131d;

/**
 * 根据机场、当前运行方向 ('09' 主运行 / '27' 换端运行) 与单/双跑道模式，返回当前活动的进港与离港跑道
 */
function getActiveRunwaysForDirection(dir, runwayCountMode = 'DUAL', airportOrId = 'ZSHB') {
  const airport = typeof airportOrId === 'string' ? AIRPORTS_DATABASE[airportOrId] || HARBOR_AIRPORT : airportOrId;
  const pair = dir === '09' ? airport.primaryFlowRunways : airport.reverseFlowRunways;
  if (runwayCountMode === 'SINGLE') {
    return {
      arrivalRunway: pair.arrival,
      departureRunway: pair.arrival,
      allActive: [pair.arrival],
      flowLabelCn: `${pair.arrival}(单跑道混合起降)`,
      flowLabelEn: `SINGLE RWY ${pair.arrival}`
    };
  }
  return {
    arrivalRunway: pair.arrival,
    departureRunway: pair.departure,
    allActive: [pair.arrival, pair.departure],
    flowLabelCn: pair.labelCn,
    flowLabelEn: pair.labelEn
  };
}

  return airport.runways[fallbackKey];
}

/**
 * 任意角度跑道 (0°–359°) 的通用二维航向道与下滑道向量几何解算器
 */
function computeRunwayLocalizerGeometry(pos, rwy) {
  const rad = rwy.heading * Math.PI / 180;
  const ux = Math.sin(rad);
  const uy = Math.cos(rad);
  const nx = Math.cos(rad);
  const ny = -Math.sin(rad);
  const dxFromThreshold = pos.x - rwy.threshold.x;
  const dyFromThreshold = pos.y - rwy.threshold.y;
  const rolloutDistNM = dxFromThreshold * ux + dyFromThreshold * uy;
  const axialDistNM = -rolloutDistNM;
  const signedCrossTrackNM = dxFromThreshold * nx + dyFromThreshold * ny;
  const crossTrackErrorNM = Math.abs(signedCrossTrackNM);
  return {
    axialDistNM,
    rolloutDistNM,
    signedCrossTrackNM,
    crossTrackErrorNM,
    forwardUnit: {
      x: ux,
      y: uy
    },
    rightNormalUnit: {
      x: nx,
      y: ny
    }
  };
}
function checkIlsConditions(ac, airport, overrideRunwayId, unit = 'METRIC') {
  const rwy = getRunwayConfig(airport, overrideRunwayId || ac.assignedRunway);
  const geom = computeRunwayLocalizerGeometry(ac.position, rwy);
  const {
    axialDistNM,
    crossTrackErrorNM
  } = geom;
  const distToThresholdNM = distanceNM(ac.position, rwy.threshold);
  const headingErrorDeg = Math.abs(shortestHeadingDelta(ac.heading, rwy.heading));
  const maxInterceptAngleDeg = ac.independentApproachMode ? 30 : 45;
  const glideslopeDist = Math.max(0, axialDistNM);
  const idealGlideslopeAltFt = Math.min(3600, Math.round(glideslopeDist * 318));
  const canTouchdown = crossTrackErrorNM <= 0.35 && headingErrorDeg <= 15 && ac.altitude <= 420 && ac.speed <= 178;
  if (axialDistNM <= 1.0) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, PAST APPROACH GATE`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：飞机已越过五边切入点（请点击【🎯 一键引导五边】自动掉头切入）`
    };
  }
  if (axialDistNM > 20.0) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, TOO FAR FROM LOCALIZER (>20 NM)`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：距离跑道过远 (>20 NM，请先点 STAR 或【🎯 一键引导五边】)`
    };
  }
  if (ac.altitude > 5000) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, ALTITUDE TOO HIGH (MUST BE AT OR BELOW ${formatAltitudeSpeechEn(5000, unit)})`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：当前高度过高（需降至 ≤${formatAltitudeValue(5000, unit)}，或点【🎯 一键引导五边】自动下高切入）`
    };
  }
  if (ac.speed > 245) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, AIRSPEED TOO FAST (REDUCE BELOW 240 KT)`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：当前速度过快（请减速至 ≤240 节或点【🎯 一键引导五边】）`
    };
  }
  if (crossTrackErrorNM > 6.5) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, TOO FAR OFF CENTERLINE (>6.5 NM)`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：横向偏离延长线过远 (>6.5 NM，请点【🎯 一键引导五边】自动切入)`
    };
  }
  if (headingErrorDeg > 105) {
    return {
      runwayId: rwy.id,
      canAcceptClearance: false,
      canLockLocalizer: false,
      canTouchdown,
      distToThresholdNM,
      axialDistNM,
      crossTrackErrorNM,
      headingErrorDeg,
      idealGlideslopeAltFt,
      maxInterceptAngleDeg,
      reasonEn: `UNABLE ILS RWY ${rwy.id}, HEADING AWAY FROM FINAL APPROACH COURSE`,
      reasonCn: `无法直接建立 ILS ${rwy.id}：当前航向背离五边方向 (${formatHeading(rwy.heading)}°，请点【🎯 一键引导五边】)`
    };
  }
  const targetHdgErrorDeg = Math.abs(shortestHeadingDelta(ac.targetHeading, rwy.heading));
  const effectiveInterceptAngle = Math.min(headingErrorDeg, targetHdgErrorDeg);
  const canLockLocalizer = axialDistNM >= 0.8 && axialDistNM <= rwy.ilsRangeNM && crossTrackErrorNM <= 1.2 && effectiveInterceptAngle <= maxInterceptAngleDeg + 5 && ac.altitude <= idealGlideslopeAltFt + 1500;
  return {
    runwayId: rwy.id,
    canAcceptClearance: true,
    canLockLocalizer,
    canTouchdown,
    distToThresholdNM,
    axialDistNM,
    crossTrackErrorNM,
    headingErrorDeg,
    idealGlideslopeAltFt,
    maxInterceptAngleDeg
  };
}

/**
 * 计算 AMAN (Arrival Manager) 进港航班队列排序与调速建议
 */
function computeAmanSequence(aircraftList, airport) {
  const arrivals = aircraftList.filter(a => a.category === 'ARRIVAL' && a.phase !== 'LANDED' && a.phase !== 'EXITED_AIRSPACE' && a.phase !== 'HOLD_CROSSING');
  const items = arrivals.map(ac => {
    const rwy = getRunwayConfig(airport, ac.assignedRunway);
    const dist = distanceNM(ac.position, rwy.threshold);
    const gs = Math.max(120, ac.groundSpeed);
    const etaSec = Math.round(dist / gs * 3600);
    return {
      aircraftId: ac.id,
      callsign: ac.callsign,
      wakeBadge: `${ac.model}/${ac.wakeCode}`,
      assignedRunway: ac.assignedRunway,
      distToThresholdNM: Number(dist.toFixed(1)),
      etaSec,
      recommendedActionCn: '保持当前速度',
      isEmergency: ac.emergencyType !== 'NONE'
    };
  });
  items.sort((a, b) => a.etaSec - b.etaSec);
  for (let i = 0; i < items.length; i++) {
    const cur = items[i];
    if (cur.isEmergency) {
      cur.recommendedActionCn = '🚨 7700/7600 特情优先落地';
      continue;
    }
    if (i > 0) {
      const prev = items[i - 1];
      const gapSec = cur.etaSec - prev.etaSec;
      if (gapSec < 50 && cur.assignedRunway === prev.assignedRunway) {
        cur.recommendedActionCn = `⚠ 距前机过近(+${gapSec}s)，建议减速 160kt 或改配次跑道`;
      } else if (gapSec < 85 && cur.assignedRunway === prev.assignedRunway) {
        cur.recommendedActionCn = `建议减速至 180kt 拉开尾流间隔`;
      } else {
        cur.recommendedActionCn = `间隔正常 (+${gapSec}s)`;
      }
    } else {
      cur.recommendedActionCn = '五边排首 (一号落地)';
    }
  }
  return items;
}

/**
 * 单架飞机的固定时间步长物理与状态机更新
 */
function updateAircraftPhysics(ac, dtSec, airport, runwayOccupiedByOther, weather, enableRunwayCrossing = false, altitudeUnit = 'METRIC', enableRestrictedZones = true, requireLandingClearance = false) {
  if (ac.phase === 'HOLDING_GROUND' || ac.phase === 'LINE_UP_WAIT' || ac.phase === 'HOLD_CROSSING' || ac.phase === 'LANDED' || ac.phase === 'HANDED_OFF' || ac.phase === 'EXITED_AIRSPACE') {
    return {
      aircraft: ac,
      events: []
    };
  }
  const next = {
    ...ac,
    position: {
      ...ac.position
    },
    trail: ac.trail,
    procedureLegs: ac.procedureLegs ? [...ac.procedureLegs] : [],
    holdState: ac.holdState ? {
      ...ac.holdState,
      center: {
        ...ac.holdState.center
      }
    } : null,
    identFlashTimerSec: Math.max(0, (ac.identFlashTimerSec || 0) - dtSec)
  };
  const events = [];
  const spec = _harborAirport.AIRCRAFT_MODELS[next.model] || _harborAirport.AIRCRAFT_MODELS.A320;
  const rwy = getRunwayConfig(airport, next.assignedRunway);

  // 0. 若为 7600 无线电通信失效 (NORDO) 航班，机组自主飞向五边 FAF/IF 建立盲降
  if (next.emergencyType === 'SQUAWK_7600_NORDO' && next.category === 'ARRIVAL' && next.phase === 'ARRIVING') {
    const ilsCheck = checkIlsConditions(next, airport, rwy.id, altitudeUnit);
    if (ilsCheck.canAcceptClearance) {
      next.clearedApproach = true;
      next.phase = ilsCheck.canLockLocalizer ? 'FINAL_APPROACH' : 'INTERCEPTING';
    } else if (!next.directWaypointId) {
      const candidateFixes = airport.waypoints.filter(w => w.role === 'FAF' || w.role === 'IF');
      let bestFix = candidateFixes[0]?.id || airport.waypoints[0]?.id || 'HARBR';
      let bestScore = Infinity;
      for (const fix of candidateFixes) {
        const g = computeRunwayLocalizerGeometry(fix.position, rwy);
        if (g.axialDistNM > 2 && g.crossTrackErrorNM < 3.5 && g.axialDistNM < bestScore) {
          bestScore = g.axialDistNM;
          bestFix = fix.id;
        }
      }
      next.directWaypointId = bestFix;
      next.targetAltitude = 2000;
      next.targetSpeed = 180;
    }
  }

  // 1. 起飞滑跑阶段 (TAKEOFF_ROLL)
  if (next.phase === 'TAKEOFF_ROLL') {
    next.heading = rwy.heading;
    next.targetHeading = rwy.heading;
    next.altitude = 0;
    next.verticalSpeed = 0;
    next.speed = stepScalar(next.speed, spec.rotationSpeed + 15, spec.takeoffAccel, dtSec);
    next.groundSpeed = next.speed;
    const moveDistNM = next.speed * dtSec / 3600;
    const rad = next.heading * Math.PI / 180;
    next.position.x += moveDistNM * Math.sin(rad);
    next.position.y += moveDistNM * Math.cos(rad);
    if (next.speed >= spec.rotationSpeed) {
      next.phase = 'INITIAL_CLIMB';
      if (next.targetAltitude < 2000) {
        next.targetAltitude = 4000;
      }
      if (next.targetSpeed < 200) {
        next.targetSpeed = Math.min(230, spec.cruiseSpeed);
      }
      events.push({
        type: 'AIRBORNE',
        aircraftId: next.id,
        callsign: next.callsign,
        runwayId: rwy.id,
        detailEn: `${next.callsign} AIRBORNE RWY ${rwy.id}, CLIMBING TO ${formatAltitudeSpeechEn(next.targetAltitude, altitudeUnit)}.`,
        detailCn: `${next.callsign} 已从 ${rwy.id} 跑道离地，按标准高度层爬升至 ${formatAltitudeSpeechCn(next.targetAltitude, altitudeUnit)}。`
      });
    }
    return {
      aircraft: next,
      events
    };
  }

  // 2. 着陆滑跑阶段 (LANDING_ROLL)
  if (next.phase === 'LANDING_ROLL') {
    next.heading = rwy.heading;
    next.targetHeading = rwy.heading;
    next.altitude = 0;
    next.targetAltitude = 0;
    next.verticalSpeed = 0;
    next.speed = stepScalar(next.speed, 25, spec.landingDecel, dtSec);
    next.groundSpeed = next.speed;
    const moveDistNM = next.speed * dtSec / 3600;
    const rad = next.heading * Math.PI / 180;
    next.position.x += moveDistNM * Math.sin(rad);
    next.position.y += moveDistNM * Math.cos(rad);
    const geom = computeRunwayLocalizerGeometry(next.position, rwy);
    next.position.x = rwy.threshold.x + geom.rolloutDistNM * geom.forwardUnit.x;
    next.position.y = rwy.threshold.y + geom.rolloutDistNM * geom.forwardUnit.y;
    const passedEnd = geom.rolloutDistNM >= rwy.lengthNM;
    if (next.speed <= 35 || passedEnd) {
      next.speed = 0;
      next.groundSpeed = 0;
      next.targetSpeed = 0;
      const isPrimaryArrRwy = rwy.id === airport.primaryFlowRunways.arrival || rwy.id === airport.reverseFlowRunways.arrival;
      const innerRwy = rwy.id === airport.primaryFlowRunways.arrival ? airport.primaryFlowRunways.departure : airport.reverseFlowRunways.departure;
      if (enableRunwayCrossing && isPrimaryArrRwy && innerRwy !== rwy.id) {
        next.phase = 'HOLD_CROSSING';
        next.crossingRunwayId = innerRwy;
        const innerCfg = getRunwayConfig(airport, innerRwy);
        next.position = {
          x: (rwy.end.x + innerCfg.threshold.x) * 0.5,
          y: (rwy.end.y + innerCfg.threshold.y) * 0.5
        };
        next.lastCommandText = `HOLD SHORT ${innerRwy}`;
        events.push({
          type: 'HOLD_CROSSING',
          aircraftId: next.id,
          callsign: next.callsign,
          runwayId: innerRwy,
          detailEn: `${next.callsign} VACATED RWY ${rwy.id}, HOLDING SHORT OF RWY ${innerRwy}, REQUEST CROSSING TO TERMINAL.`,
          detailCn: `${next.callsign} 已脱离 ${rwy.id} 跑道，在滑行道等待点请求穿越跑道 ${innerRwy} 回航站楼！`
        });
      } else {
        next.phase = 'LANDED';
        events.push({
          type: 'LANDED',
          aircraftId: next.id,
          callsign: next.callsign,
          runwayId: rwy.id,
          detailEn: `${next.callsign} TOUCHDOWN AND VACATED RWY ${rwy.id}. WELCOME TO ${airport.icao}!`,
          detailCn: `${next.callsign} 已安全降落并脱离 ${rwy.id} 跑道！`
        });
      }
    }
    return {
      aircraft: next,
      events
    };
  }

  // 离场飞机爬升越过 360m (1200ft) 后转入 DEPARTING 阶段；
  // 若玩家尚未手动指定其他航向且飞机有飞行计划离场点 (assignedExitId)，自动接通离场航路并爬升至移交层 1800m (6000ft)
  if (next.phase === 'INITIAL_CLIMB' && next.altitude >= 1200) {
    next.phase = 'DEPARTING';
    if (!next.directWaypointId && next.procedureLegs.length === 0 && next.assignedExitId && Math.abs(shortestHeadingDelta(next.targetHeading, rwy.heading)) < 5) {
      const exitWp = airport.waypoints.find(w => w.id === next.assignedExitId);
      if (exitWp) {
        next.directWaypointId = exitWp.id;
        next.targetAltitude = Math.max(next.targetAltitude, exitWp.recommendedAltitude || 6000);
        next.lastCommandText = `SID ${exitWp.id}`;
      }
    }
  }

  // 3. STAR / SID 多航段自动序列与航路点直飞 (DCT)
  if (next.procedureLegs.length > 0 && !next.directWaypointId) {
    const firstLeg = next.procedureLegs[0];
    next.directWaypointId = firstLeg.waypointId;
    if (firstLeg.targetAltitude && !next.tcasRaActive) {
      next.targetAltitude = firstLeg.targetAltitude;
    }
    if (firstLeg.maxSpeed) {
      next.targetSpeed = Math.min(next.targetSpeed, firstLeg.maxSpeed);
    }
  }
  if (next.directWaypointId && next.phase !== 'FINAL_APPROACH' && next.phase !== 'HOLDING_AIR') {
    const wp = airport.waypoints.find(w => w.id === next.directWaypointId);
    if (wp) {
      const dist = distanceNM(next.position, wp.position);
      if (dist <= 0.75) {
        const reachedId = wp.id;
        const wasOnStarProcedure = Boolean(next.activeProcedureId && next.category === 'ARRIVAL');
        if (next.procedureLegs.length > 0 && next.procedureLegs[0].waypointId === reachedId) {
          next.procedureLegs.shift();
        }
        if (next.procedureLegs.length > 0) {
          const nextLeg = next.procedureLegs[0];
          next.directWaypointId = nextLeg.waypointId;
          if (nextLeg.targetAltitude && !next.tcasRaActive) {
            next.targetAltitude = nextLeg.targetAltitude;
          }
          if (nextLeg.maxSpeed) {
            next.targetSpeed = Math.min(next.targetSpeed, nextLeg.maxSpeed);
          }
          events.push({
            type: 'WAYPOINT_REACHED',
            aircraftId: next.id,
            callsign: next.callsign,
            detailEn: `${next.callsign} PASSING ${reachedId}, PROCEEDING DIRECT ${nextLeg.waypointId} ON ${next.activeProcedureId || 'ROUTE'}.`,
            detailCn: `${next.callsign} 已飞越 ${reachedId}，按程序继续直飞下一航路点 ${nextLeg.waypointId}。`
          });
        } else {
          next.directWaypointId = null;
          next.activeProcedureId = null;
          events.push({
            type: 'WAYPOINT_REACHED',
            aircraftId: next.id,
            callsign: next.callsign,
            detailEn: `${next.callsign} OVER ${reachedId}.`,
            detailCn: `${next.callsign} 已飞越航路点 ${reachedId}。`
          });
          // 若进港航班飞完 STAR 标准进场程序的最终进近点 (FAF/IF) 或已预位盲降，自动转入 INTERCEPTING 对正五边下滑道！
          if (next.category === 'ARRIVAL' && (next.clearedApproach || wasOnStarProcedure)) {
            next.clearedApproach = true;
            next.phase = 'INTERCEPTING';
            next.targetHeading = rwy.heading;
            next.targetAltitude = Math.min(next.targetAltitude, 2000);
            next.targetSpeed = Math.min(next.targetSpeed, 175);
            next.lastCommandText = `LOC RWY ${rwy.id}`;
          } else if (wp.role === 'FAF' || wp.role === 'IF') {
            next.targetHeading = rwy.heading;
          }
        }
      } else {
        next.targetHeading = bearingTo(next.position, wp.position);
        next.turnDirection = 'AUTO';
      }
    }
  }

  // 4. 空中等待航线 (HOLD)
  if (next.phase === 'HOLDING_AIR' && next.holdState) {
    const hs = next.holdState;
    const distToFix = distanceNM(next.position, hs.center);
    const inbound = normalizeHeading(hs.inboundHeading);
    const outbound = normalizeHeading(inbound + 180);
    if (hs.legPhase === 'TO_FIX') {
      next.targetHeading = bearingTo(next.position, hs.center);
      next.turnDirection = 'AUTO';
      if (distToFix <= 0.5) {
        hs.legPhase = 'OUTBOUND_TURN';
        hs.legTimerSec = 0;
        next.targetHeading = outbound;
        next.turnDirection = 'RIGHT';
      }
    } else if (hs.legPhase === 'OUTBOUND_TURN') {
      next.targetHeading = outbound;
      next.turnDirection = 'RIGHT';
      if (Math.abs(shortestHeadingDelta(next.heading, outbound)) <= 5) {
        hs.legPhase = 'OUTBOUND_LEG';
        hs.legTimerSec = 0;
      }
    } else if (hs.legPhase === 'OUTBOUND_LEG') {
      next.targetHeading = outbound;
      hs.legTimerSec += dtSec;
      if (hs.legTimerSec >= 25) {
        hs.legPhase = 'INBOUND_TURN';
        hs.legTimerSec = 0;
        next.targetHeading = inbound;
        next.turnDirection = 'RIGHT';
      }
    } else if (hs.legPhase === 'INBOUND_TURN') {
      next.targetHeading = inbound;
      next.turnDirection = 'RIGHT';
      if (Math.abs(shortestHeadingDelta(next.heading, inbound)) <= 8) {
        hs.legPhase = 'INBOUND_LEG';
        hs.legTimerSec = 0;
      }
    } else if (hs.legPhase === 'INBOUND_LEG') {
      next.targetHeading = bearingTo(next.position, hs.center);
      next.turnDirection = 'AUTO';
      if (distToFix <= 0.5 || hs.legTimerSec >= 35) {
        hs.legPhase = 'OUTBOUND_TURN';
        hs.legTimerSec = 0;
        next.targetHeading = outbound;
        next.turnDirection = 'RIGHT';
      } else {
        hs.legTimerSec += dtSec;
      }
    }
  }

  // 5. ILS 进近双阶段智能截获控制器 (INTERCEPTING -> FINAL_APPROACH)
  if (next.clearedApproach && next.phase === 'INTERCEPTING') {
    const geom = computeRunwayLocalizerGeometry(next.position, rwy);
    if (!next.directWaypointId) {
      // 阶段 A：若飞机尚在跑道正切/三边位置 (axialDistNM < 5.2 NM) 或偏离延长线较远 (crossTrackErrorNM > 3.2 NM)，
      // 先平滑引向五边延长线 10.5 NM 的对正切入点 (Approach Gate)，高度降至 900m (3000ft)
      if (geom.axialDistNM < 5.2 || geom.crossTrackErrorNM > 3.2) {
        const gateDist = Math.max(9.5, Math.min(13.0, geom.axialDistNM + 3.5));
        const gatePt = {
          x: rwy.threshold.x - gateDist * geom.forwardUnit.x,
          y: rwy.threshold.y - gateDist * geom.forwardUnit.y
        };
        next.targetHeading = bearingTo(next.position, gatePt);
        next.turnDirection = 'AUTO';
        if (!next.tcasRaActive) {
          next.targetAltitude = Math.min(next.targetAltitude, 3000);
        }
        next.targetSpeed = Math.min(next.targetSpeed, 185);
      } else {
        // 阶段 B：已进入五边扇区 (axialDistNM >= 5.2 NM 且 crossTrackErrorNM <= 3.2 NM)，
        // 动态瞄准中心线上前方前瞻点，以 ≤38° 截获角平滑切入航向道并跟随下滑道高度
        const lookaheadNM = Math.max(2.0, Math.min(4.2, geom.crossTrackErrorNM * 1.3 + 1.6));
        const aimAxial = Math.max(1.2, geom.axialDistNM - lookaheadNM);
        const aimPt = {
          x: rwy.threshold.x - aimAxial * geom.forwardUnit.x,
          y: rwy.threshold.y - aimAxial * geom.forwardUnit.y
        };
        const rawInterceptHdg = bearingTo(next.position, aimPt);
        const diffFromRwy = shortestHeadingDelta(rwy.heading, rawInterceptHdg);
        const clampedDiff = Math.max(-42, Math.min(42, diffFromRwy));
        next.targetHeading = normalizeHeading(rwy.heading + clampedDiff);
        next.turnDirection = 'AUTO';
        if (!next.tcasRaActive) {
          const gsAlt = Math.max(1800, Math.min(3000, Math.round(geom.axialDistNM * 310)));
          next.targetAltitude = Math.min(next.targetAltitude, gsAlt);
        }
        next.targetSpeed = Math.min(next.targetSpeed, 175);
      }
    }

    // 4. 航向三位数字 (航向 270 -> 航向 两拐洞)
    text = text.replace(/(航向\s*)([0-9]{3})/g, (_, prefix, hdg) => {
      return `${prefix}${toCnDigits(hdg)}`;
    });

    // 5. 甚高频频率 (125.8 -> 幺两五点八)
    text = text.replace(/\b(1[12][0-9])\.([0-9]{1,2})\b/g, (_, p1, p2) => {
      return `${toCnDigits(p1)}点${toCnDigits(p2)}`;
    });

    // 6. 航司中文名与应答机编码数字逐位播报
    text = text.replace(/(航空|国航|南航|东航|海航|厦航|川航|货航|全日空|天马|北海道|维珍|易捷|汉莎|应答机|编码)\s*([0-9]{3,4})/g, (_, prefix, num) => `${prefix} ${toCnDigits(num)}`);

    // 7. 清理残留英文空管缩写为纯正中文民航术语
    text = text.replace(/\bILS\s*盲降/gi, '盲降').replace(/\bILS\b/gi, '盲降').replace(/\bRWY\b/gi, '跑道').replace(/\bIDENT\b/gi, '识别');
    return text.replace(/\s+/g, ' ').trim();
  }

  // ==================== 英文 ICAO 标准 Kokoro 发音转换 ====================
  const toEnDigits = numStr => numStr.split('').map(d => ICAO_DIGIT_PHONETIC_EN[d] ?? d).join(' ');

  // 1. 缩写展开
  text = text.replace(/\bRWY\b/gi, 'runway').replace(/\bHDG\b/gi, 'heading').replace(/\bALT\b/gi, 'altitude').replace(/\bSPD\b/gi, 'speed').replace(/\bSQK\b/gi, 'squawk').replace(/\bKT\b/gi, 'knots').replace(/\bFT\b/gi, 'feet').replace(/\bILS\b/gi, 'I L S');

  // 2. 单字母注册号/呼号 (例如 B9001 -> Bravo niner zero zero one, N738 -> November seven tree ait)
  text = text.replace(/\b([A-Z])-?([0-9]{3,4})\b/g, (_, letter, digits) => {
    const nato = ICAO_NATO_LETTER_MAP[letter.toUpperCase()] || letter;
    return `${nato} ${toEnDigits(digits)}`;
  });

  // 3. 三字码呼号 (例如 CES5213 -> Charlie Echo Sierra fife two wun tree)
  const icaoAirlineCallsignMap = {
    CES: 'China Eastern',
    CCA: 'Air China',
    CSN: 'China Southern',
    CHH: 'Hainan',
    CPA: 'Cathay',
    CXA: 'Xiamen Air',
    CSC: 'Sichuan',
    CKK: 'Cargo King',
    ANA: 'All Nippon',
    JAL: 'Japan Air',
    SKY: 'Skymark',
    ADO: 'Air Do',
    BAW: 'Speedbird',
    VIR: 'Virgin',
    EZY: 'Easy',
    DLH: 'Lufthansa',
    AFR: 'Airfrans',
    SIA: 'Singapore'
  };
  text = text.replace(/\b([A-Z]{3})\s*([0-9]{2,4})\b/g, (full, prefix, digits) => {
    const up = prefix.toUpperCase();
    if (up === 'ILS' || up === 'RWY' || up === 'HDG' || up === 'ALT' || up === 'SPD') {
      return full;
    }
    const callPrefix = icaoAirlineCallsignMap[up] || up.split('').map(ch => ICAO_NATO_LETTER_MAP[ch] || ch).join(' ');
    return `${callPrefix} ${toEnDigits(digits)}`;
  });

  // 4. 跑道编号 (例如 09L -> zero niner left, 27R -> two seven right, 34R -> tree fower right, 22 -> two two)
  text = text.replace(/\b(runway\s+)?(09|27|34|16|35|17|22|04)([LR])?\b/gi, (_, rwyWord, digits, side) => {
    const prefix = rwyWord ? 'runway ' : '';
    const sideWord = side?.toUpperCase() === 'L' ? ' left' : side?.toUpperCase() === 'R' ? ' right' : '';
    return `${prefix}${toEnDigits(digits)}${sideWord}`;
  });

  // 5. 甚高频电台频率 (例如 125.8 -> wun two fife decimal eight, 119.75 -> wun wun niner decimal seven fife)
  text = text.replace(/\b(1[12][0-9])\.([0-9]{1,2})\b/g, (_, p1, p2) => {
    return `${toEnDigits(p1)} decimal ${toEnDigits(p2)}`;
  });

  // 6. 高度整千/整百标准读法 (例如 2000 feet -> two thousand feet, 600 meters -> six hundred meters, 2400 meters -> two thousand fower hundred meters)
  text = text.replace(/\b([1-9])([0-9])00\s+(feet|meters)\b/gi, (_, th, hu, unitWord) => {
    const thWord = ICAO_DIGIT_PHONETIC_EN[th] || th;
    if (hu === '0') {
      return `${thWord} thousand ${unitWord.toLowerCase()}`;
    }
    const huWord = ICAO_DIGIT_PHONETIC_EN[hu] || hu;
    return `${thWord} thousand ${huWord} hundred ${unitWord.toLowerCase()}`;
  });
  text = text.replace(/\b([1-9])00\s+(feet|meters)\b/gi, (_, hu, unitWord) => {
    const huWord = ICAO_DIGIT_PHONETIC_EN[hu] || hu;
    return `${huWord} hundred ${unitWord.toLowerCase()}`;
  });

  // 7. 航向、速度、航班号尾号与应答机编码：凡剩余 2~4 位数字（如 270, 090, 180, 5213, 7700）一律逐位读出！
  text = text.replace(/\b([0-9]{2,4})\b/g, (_, digits) => toEnDigits(digits));
  return text.replace(/\s+/g, ' ').trim();
}

/**
 * 第一步：SenseVoice Small 空域上下文校验与同音词纠偏器
 * 【技术细节 1】：SenseVoice 并不是航空专用模型。利用当前活动航班呼号、导航台(Waypoints)和跑道信息校验识别结果，

  const termReplacements = [[/忙讲|盲讲|盲浆|芒将|忙将/g, '盲降'], [/左拐|往左转|左转弯/g, '左转'], [/右拐|往右转|右转弯/g, '右转'], [/下降到|下降至|降到|降至|下到|下高到|下高度到/g, '下降至'], [/上升到|上升至|爬升到|爬升至|上到/g, '爬升至'], [/起肥|齐非|启飞|气飞/g, '起飞'], [/医教|移较|移接|移调/g, '移交'], [/减诉|减数|减速到|减速至/g, '减速'], [/忙降|茫降|芒降|盲将|盲匠|忙将|麻将|氓降|盲江/g, '盲降'], [/五编|五遍|武边|午边|无边|舞边|伍边|5边|五鞭/g, '五边'], [/进进|近近|静静|进境|前进跑道|进近跑道/g, '进近'], [/航相|行向|方向|航线|好想|好像/g, '航向'], [/起非|齐飞|气肥|乞飞/g, '起飞'], [/付飞|富飞|负飞|父飞|赴飞/g, '复飞'], [/一交|移焦|已交|宜交|医交/g, '移交'], [/区条|曲调|去调/g, '区调'], [/应答鸡|硬答机|应当机/g, '应答机'], [/左传|佐转/g, '左转'], [/右传|又转|幼转/g, '右转'], [/直非|值飞/g, '直飞'], [/东航|冬航|东方航空|中方航空|懂航/g, '东方'], [/国航|过航|果航|中国国航|中航/g, '国航'], [/南航|兰航|蓝航|南方航空|难航/g, '南方'], [/海航|还航|嗨航|海南航空/g, '海南'], [/厦航|下航|夏航|厦门航空/g, '厦门'], [/川航|穿航|四川航空/g, '四川'], [/国太|国泰航空/g, '国泰'], [/中货航|货航/g, '中货航'], [/全立空|全日空航空/g, '全日空'], [/日航|日本航空/g, '日本航空'], [/英航|英国航空|速鸟/g, '英国航空'], [/维珍航空/g, '维珍'], [/汉莎航空/g, '汉莎'], [/法航|法国航空/g, '法国航空'], [/新航|新加坡航空/g, '新加坡']];

  }

  // 5. 利用当前活动航班列表校验识别结果
  if (aircraftList && aircraftList.length > 0) {

      const numPart = ac.callsign.replace(/^[A-Z]{3}/, '');

}

  for (const [regex, replacement] of phraseMap) {
